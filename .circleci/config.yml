version: '2.1'

# Setup phase: continue only when a change can affect the packaged chart or
# its validation contract. This is a chart-only repo -- it consumes upstream
# teslamate/teslamate-grafana images directly, so there is no Dockerfile and
# no image build/validate/promote step here, only the Helm chart itself.
#
# Every commit's changed files are diffed against master (the merge base), so
# a feature branch always sees the full set of changes since it diverged, and
# a push to master itself falls back to comparing against its parent commit.
# The continuation config then decides, per branch, whether to just lint and
# template the chart or to also publish it and verify the Flux deployment.
setup: true

orbs:
  path-filtering: circleci/path-filtering@2

workflows:
  detect-chart-changes:
    jobs:
      - path-filtering/filter:
          name: detect-chart-changes
          base-revision: master
          config-path: .circleci/continue_config.yml
          circleci_domain: circle.ehws.generic.business
          resource_class: denislemire/ehws
          mapping: |
            ^\.circleci/.* run_chart_pipeline true
            ^templates/.* run_chart_pipeline true
            ^Chart\.yaml$ run_chart_pipeline true
            ^values\.yaml$ run_chart_pipeline true
