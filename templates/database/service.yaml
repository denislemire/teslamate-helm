{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "teslamate.database.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ include "teslamate.databasePort" . }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "teslamate.database.selectorLabels" . | nindent 4 }}
{{- end }}
