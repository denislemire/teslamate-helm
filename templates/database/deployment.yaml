{{- if and .Values.database.enabled .Values.database.persistence.existingClaim }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teslamate-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "teslamate.database.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "teslamate.database.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "teslamate.database.selectorLabels" . | nindent 8 }}
      {{- include "teslamate.podAnnotations" .Values.database | nindent 6 }}
    spec:
      {{- include "teslamate.podPlacement" (dict "component" .Values.database "root" .) | nindent 6 }}
      {{- include "teslamate.podSecurityContext" .Values.database | nindent 6 }}
      containers:
        - name: teslamate-db
          image: "{{ .Values.database.image.registry }}{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          {{- include "teslamate.containerSecurityContext" .Values.database | nindent 10 }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.existingSecretUserKey | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.existingSecretPasswordKey | quote }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.existingSecretDatabaseKey | quote }}
            {{- with .Values.database.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.database.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 5432
              name: postgres
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: data
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: {{ .Values.database.persistence.existingClaim | quote }}
{{- end }}
