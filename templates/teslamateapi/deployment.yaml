{{- if .Values.teslamateApi.enabled }}
{{- $secretName := default .Values.teslamate.existingSecret .Values.teslamateApi.existingSecret }}
{{- if not $secretName }}
{{- fail "teslamateApi.enabled requires teslamate.existingSecret or teslamateApi.existingSecret (for ENCRYPTION_KEY and DATABASE_PASS)" }}
{{- end }}
{{- $encKey := default .Values.teslamate.existingSecretEncryptionKey .Values.teslamateApi.existingSecretEncryptionKey }}
{{- $passKey := default .Values.teslamate.existingSecretPasswordKey .Values.teslamateApi.existingSecretPasswordKey }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teslamateapi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "teslamate.api.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "teslamate.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "teslamate.api.selectorLabels" . | nindent 8 }}
      {{- include "teslamate.podAnnotations" .Values.teslamateApi | nindent 6 }}
    spec:
      {{- include "teslamate.podPlacement" (dict "component" .Values.teslamateApi "root" .) | nindent 6 }}
      {{- include "teslamate.podSecurityContext" .Values.teslamateApi | nindent 6 }}
      containers:
        - name: teslamateapi
          image: "{{ .Values.teslamateApi.image.registry }}{{ .Values.teslamateApi.image.repository }}:{{ .Values.teslamateApi.image.tag }}"
          imagePullPolicy: {{ .Values.teslamateApi.image.pullPolicy }}
          {{- include "teslamate.containerSecurityContext" .Values.teslamateApi | nindent 10 }}
          envFrom:
            - configMapRef:
                name: teslamateapi-config
            {{- with .Values.teslamateApi.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName | quote }}
                  key: {{ $encKey | quote }}
            - name: DATABASE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName | quote }}
                  key: {{ $passKey | quote }}
            {{- if .Values.teslamateApi.apiTokenExistingSecret }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.teslamateApi.apiTokenExistingSecret | quote }}
                  key: {{ default "API_TOKEN" .Values.teslamateApi.apiTokenSecretKey | quote }}
            {{- end }}
            {{- if .Values.mosquitto.auth.existingSecret }}
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mosquitto.auth.existingSecret | quote }}
                  key: {{ .Values.mosquitto.auth.existingSecretUsernameKey | quote }}
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mosquitto.auth.existingSecret | quote }}
                  key: {{ .Values.mosquitto.auth.existingSecretPasswordKey | quote }}
            {{- end }}
            {{- with .Values.teslamateApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.teslamateApi.resources | nindent 12 }}
{{- end }}
